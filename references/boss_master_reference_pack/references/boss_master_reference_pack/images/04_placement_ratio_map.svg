<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#171327"/><stop offset="1" stop-color="#0c0a14"/></linearGradient>
    <radialGradient id="violet"><stop offset="0" stop-color="#f2d7ff"/><stop offset="0.25" stop-color="#c760ff"/><stop offset="1" stop-color="#4a168a"/></radialGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#f2c879"/></marker>
    <style>
      .title{font:700 34px 'DejaVu Sans',sans-serif;fill:#fff}.sub{font:600 22px 'DejaVu Sans',sans-serif;fill:#d9c7ff}.label{font:500 19px 'DejaVu Sans',sans-serif;fill:#f6f2ff}.small{font:500 16px 'DejaVu Sans',sans-serif;fill:#c9bddf}.gold{stroke:#f2c879;fill:none;stroke-width:4}.guide{stroke:#856caf;stroke-width:2;stroke-dasharray:8 7}.mob{fill:#26113f;stroke:#a94eff;stroke-width:5}.panel{fill:#121020;stroke:#4b3b69;stroke-width:2}.boss{fill:#282331;stroke:#e8e2ee;stroke-width:3}.accent{stroke:#d35cff;fill:none;stroke-width:4}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <text x="800" y="52" text-anchor="middle" class="title">BOSS WITCH QUEEN — PLACEMENT &amp; SCALE MAP</text>
  <text x="800" y="84" text-anchor="middle" class="small">H = chiều cao cơ thể từ đế giày tới đỉnh đầu; Orb / Halo / minimob giữ nguyên model hiện có</text>

  <rect x="45" y="115" width="890" height="820" rx="24" class="panel"/>
  <text x="490" y="155" text-anchor="middle" class="sub">MẶT TRƯỚC — X / Y</text>
  <line x1="490" y1="190" x2="490" y2="870" class="guide"/>
  <line x1="155" y1="850" x2="825" y2="850" class="guide"/>

  <circle cx="490" cy="340" r="175" class="gold"/>
  <path d="M490 193 a32 32 0 1 0 0.1 0" class="gold"/>
  <text x="690" y="255" class="label">HALO Ø = 0.50H</text>
  <text x="690" y="282" class="small">≈ 1.50 × vai; tâm U = 0.82H</text>

  <circle cx="490" cy="285" r="54" class="boss"/>
  <path d="M440 337 Q490 315 540 337 L590 610 Q555 655 548 850 L432 850 Q425 655 390 610 Z" class="boss"/>
  <path d="M440 355 L300 545 L325 565 L458 425 M540 355 L680 545 L655 565 L522 425" class="boss"/>
  <path d="M445 850 L420 920 M535 850 L560 920" class="boss"/>
  <path d="M455 220 L475 180 L490 212 L510 172 L528 220" class="gold"/>
  <polygon points="490,380 505,400 490,420 475,400" fill="url(#violet)" stroke="#f2c879" stroke-width="2"/>
  <text x="510" y="405" class="small">Core</text>

  <circle cx="700" cy="540" r="50" fill="url(#violet)" stroke="#f2c879" stroke-width="5"/>
  <ellipse cx="700" cy="540" rx="78" ry="24" class="gold" transform="rotate(-18 700 540)"/>
  <line x1="655" y1="560" x2="685" y2="545" class="gold" marker-end="url(#arrow)"/>
  <text x="575" y="715" class="label">ORB Ø = 0.14H</text>
  <text x="575" y="742" class="small">LeftHand + L 0.35m + U 0.08m</text>

  <path d="M205 300 Q145 330 185 390 Q235 420 260 350 Q268 305 235 285 Z" class="mob"/><circle cx="215" cy="340" r="13" fill="url(#violet)"/>
  <path d="M775 300 Q835 330 795 390 Q745 420 720 350 Q712 305 745 285 Z" class="mob"/><circle cx="765" cy="340" r="13" fill="url(#violet)"/>
  <path d="M170 540 Q105 585 170 660 Q230 680 250 595 Q245 535 210 515 Z" class="mob"/><circle cx="195" cy="575" r="13" fill="url(#violet)"/>
  <path d="M855 540 Q915 585 855 660 Q805 680 790 595 Q795 535 825 515 Z" class="mob"/><circle cx="835" cy="575" r="13" fill="url(#violet)"/>
  <text x="80" y="735" class="label">4 × MINIMOB — actor riêng</text>
  <text x="80" y="765" class="small">Upper: ±0.58H, U 0.73H</text>
  <text x="80" y="792" class="small">Lower: ±0.62H, U 0.46H</text>
  <text x="80" y="819" class="small">Chiều dài visual ≈ 0.38H</text>

  <line x1="875" y1="210" x2="875" y2="850" class="gold" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="892" y="535" class="label">H = 1.0</text>

  <rect x="965" y="115" width="590" height="820" rx="24" class="panel"/>
  <text x="1260" y="155" text-anchor="middle" class="sub">MẶT BÊN — CHIỀU SÂU</text>
  <line x1="1025" y1="850" x2="1495" y2="850" class="guide"/>

  <path d="M1110 285 q35 -35 70 0 l-10 80 q50 130 15 320 l-15 165 h-85 l12-165 q-22-150 0-320 z" class="boss"/>
  <text x="1040" y="875" class="small">Boss plane / F</text>
  <line x1="1135" y1="220" x2="1135" y2="850" stroke="#e8e2ee" stroke-width="3"/>

  <ellipse cx="1205" cy="350" rx="12" ry="175" class="gold"/>
  <line x1="1135" y1="215" x2="1205" y2="215" class="gold" marker-end="url(#arrow)"/>
  <text x="1170" y="195" text-anchor="middle" class="label">0.22 m</text>
  <text x="1228" y="320" class="small">Halo plane</text>

  <line x1="1135" y1="500" x2="1350" y2="500" class="gold" marker-end="url(#arrow)"/>
  <text x="1245" y="478" text-anchor="middle" class="label">0.60–0.72 m</text>
  <path d="M1340 300 Q1400 330 1350 400 Q1300 410 1310 340 Z" class="mob"/><circle cx="1345" cy="345" r="12" fill="url(#violet)"/>
  <path d="M1340 570 Q1400 610 1340 690 Q1290 690 1305 610 Z" class="mob"/><circle cx="1340" cy="620" r="12" fill="url(#violet)"/>
  <text x="1270" y="735" class="small">Minimob plane</text>

  <ellipse cx="1480" cy="470" rx="20" ry="300" class="accent" stroke-dasharray="12 8"/>
  <line x1="1135" y1="790" x2="1480" y2="790" class="accent" marker-end="url(#arrow)"/>
  <text x="1360" y="770" text-anchor="middle" class="label">1.20–1.50 m</text>
  <text x="1325" y="825" class="small">Black Moon: Ultimate only</text>

  <text x="1190" y="885" class="small">Ưu tiên: Face → Crown/Core → Hand/Orb</text>
  <text x="1190" y="910" class="small">Halo → Minimob → Skirt → Black Moon</text>
</svg>
